<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>一对一教务台</title>
<script>if (location.protocol === 'http:' && location.hostname.endsWith('standardpics.jp')) location.replace('https://' + location.host + location.pathname + location.search);</script>
<style>
/* 方案 A 唯新风：暖白底、墨色导航、金棕强调。只用系统字体，不加载任何外部资源（国内打开更稳）。 */
:root{
  --bg:#f7f5f0; --surface:#ffffff; --sunk:#f2efe8; --ink:#1a1814; --muted:#8a847a; --line:#e2ded6; --line-2:#ede9e2;
  --gold:#b8953a; --gold-text:#8c6d1f; --gold-soft:#f7efd9; --nav:#1a1814; --nav-ink:#f7f5f0;
  --seal:#b03a2e; --ok:#2a8a5e; --warn:#a8780e; --blue:#2a5f9e;
  --h1:#b8953a; --h2:#6f8452; --h3:#4f7396; --h4:#a0645a; --h5:#86679a; --h6:#5f8a86;
  --f-disp:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-num:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  --r:5px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f; --surface:#1e1b16; --sunk:#191712; --ink:#ece6da; --muted:#9d9587; --line:#343027; --line-2:#2a2720;
  --gold:#d2b05a; --gold-text:#dcbb66; --gold-soft:#2c2616; --nav:#ece6da; --nav-ink:#15130f;
  --seal:#e36b5d; --ok:#5dc295; --warn:#e0b04a; --blue:#7aa8e0;
  --h1:#d2b05a; --h2:#9cb57d; --h3:#82a6cb; --h4:#d4937f; --h5:#b699c8; --h6:#8cc2bd; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .xs{font-size:11.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.6}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 16px}
.top h1{font-size:17px;letter-spacing:.06em;margin-right:auto}
.top .who{font-size:12.5px;color:var(--muted)}
.layout{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:1px}
.side .grp{font-size:11px;letter-spacing:.12em;color:var(--muted);padding:12px 10px 3px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;border-radius:var(--r);border:0;background:none;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:var(--sunk)}
.nav.on{background:var(--nav);color:var(--nav-ink)}
.nav .cnt{font-family:var(--f-num);font-size:11px;background:var(--seal);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.main{padding:18px 22px 60px;min-width:0;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ph h2{font-size:20px;margin-right:auto}
.hint{font-size:12.5px;color:var(--muted);margin-top:-6px}
.scope{background:var(--gold-soft);border-radius:var(--r);padding:7px 12px;font-size:12.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card>h3{font-size:15px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;text-align:left}
button.stat{cursor:pointer} button.stat:hover{border-color:var(--gold)}
.stat small{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-num);font-weight:500;font-size:22px;line-height:1.3;color:var(--gold-text)}
.stat.al b{color:var(--seal)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--nav);color:var(--nav-ink);border-color:var(--nav)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.danger{color:var(--seal)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-block;font-size:11.5px;border-radius:3px;padding:0 7px;border:1px solid currentColor;white-space:nowrap;line-height:19px}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.seal{color:var(--seal)} .tag.mute{color:var(--muted)} .tag.gold{color:var(--gold-text)} .tag.blue{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--nav);color:var(--nav-ink);border-color:var(--nav)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.subj{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.subj::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--hc)}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:7px 12px;border-radius:0 var(--r) var(--r) 0;font-size:12.5px}
.note.warn{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 8%,var(--surface))}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:4px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--nav);color:var(--nav-ink)}
.chk{width:16px;height:16px;accent-color:var(--gold)}
details>summary{cursor:pointer;list-style:none} details>summary::-webkit-details-marker{display:none}

.cal-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mon{font-family:var(--f-num);font-size:17px;min-width:78px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .hd{background:color-mix(in srgb,var(--gold) 20%,var(--surface));font-size:12px;text-align:center;padding:4px 0;font-family:var(--f-disp)}
.cal .hd.we{color:var(--seal)}
.cal .day{background:var(--surface);min-height:96px;padding:3px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .day.off{background:var(--sunk)}
.cal .dn{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.cal .day.today .dn{color:var(--nav-ink);background:var(--nav);border-radius:3px;padding:0 5px;align-self:flex-start}
.lc{display:block;text-align:left;border:0;border-left:3px solid var(--hc);background:color-mix(in srgb,var(--hc) 14%,var(--surface));border-radius:3px;padding:1px 4px;font-size:11px;line-height:1.35;cursor:pointer;width:100%;overflow:hidden}
.lc .t{font-family:var(--f-num);font-size:10.5px}
.lc.leave{background:color-mix(in srgb,var(--seal) 10%,var(--surface));border-left-color:var(--seal);text-decoration:line-through;text-decoration-color:var(--seal)}
.lc.moved::after{content:" 调";color:var(--warn);font-weight:700}
.agenda{display:none;flex-direction:column;gap:4px}
@media (max-width:760px){.cal{display:none}.agenda{display:flex}}

.fb{position:relative;display:flex;flex-direction:column;gap:6px}
.fb .sec b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.fb .sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.stamp{position:absolute;right:12px;top:8px;width:52px;height:52px;border:2px solid var(--seal);color:var(--seal);border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;transform:rotate(-14deg);opacity:.85;letter-spacing:.1em;pointer-events:none}

.pw{display:flex;justify-content:center;padding:18px 16px}
.phone{width:100%;max-width:520px;display:flex;flex-direction:column;min-height:calc(100vh - 86px)}
.p-body{flex:1;padding:4px 0 80px;display:flex;flex-direction:column;gap:10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.tabbar button{border:0;background:none;padding:10px 0 9px;font-size:13px;color:var(--muted);cursor:pointer;position:relative;border-top:2px solid transparent}
.tabbar button.on{color:var(--ink);font-weight:700;border-top-color:var(--gold)}
.tabbar .dot{position:absolute;top:4px;margin-left:4px;min-width:16px;height:16px;border-radius:8px;background:var(--seal);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-num);padding:0 4px}
.remind{background:color-mix(in srgb,var(--blue) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:var(--r);padding:8px 10px}
.remind b{font-size:12.5px;color:var(--blue)}
.remind button{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 0;font-size:13px;cursor:pointer;color:var(--ink)}
.remind button::before{content:"· ";color:var(--blue)}
.ph-cal{padding:10px}
.ph-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ph-hd{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0;font-family:var(--f-disp)}
.ph-hd.we{color:var(--seal)}
.ph-day{border:1px solid transparent;background:var(--sunk);border-radius:6px;min-height:46px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.ph-day .n{font-family:var(--f-num);font-size:13px;line-height:1.3}
.ph-day .bars{display:flex;flex-direction:column;gap:2px;width:72%}
.ph-day .bars i{display:block;height:4px;border-radius:2px;background:var(--hc)}
.ph-day .bars i.lv{background:var(--seal);opacity:.45}
.ph-day.today .n{background:var(--nav);color:var(--nav-ink);border-radius:4px;padding:0 5px}
.ph-day.sel{border-color:var(--gold);background:var(--gold-soft)}
.les{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hc);border-radius:var(--r);padding:8px 10px}
.les .when{font-family:var(--f-num);font-size:13px;min-width:88px}
.dg{font-size:12px;color:var(--muted);letter-spacing:.05em;margin-top:2px}
.dg.today{color:var(--gold-text);font-weight:700}
.bst{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bst div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 4px;text-align:center}
.bst b{display:block;font-family:var(--f-num);font-weight:500;font-size:20px;color:var(--gold-text)}
.bst small{font-size:11.5px;color:var(--muted)}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start}
  .side{flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:50px;z-index:10;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .grp{display:none}
  .nav{width:auto;white-space:nowrap}
  .main{padding:14px 16px 50px}
  .pw{padding:10px 16px}
}
.mb{position:fixed;inset:0;background:color-mix(in srgb,#000 42%,transparent);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:8px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal.wide{max-width:860px}
.mh{display:flex;align-items:flex-start;gap:10px}
.mh h3{font-size:17px;margin-right:auto}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--nav);color:var(--nav-ink);padding:8px 18px;border-radius:999px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.toast.err{background:var(--seal);color:#fff}
.center{max-width:440px;margin:14vh auto;text-align:center;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.center h2{font-size:20px}
.busy{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="app"><div class="center"><h2>一对一教务台</h2><p class="muted">加载中…</p></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
