<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>一对一教务台</title>
<script>if (location.protocol === 'http:' && location.hostname.endsWith('standardpics.jp')) location.replace('https://' + location.host + location.pathname + location.search);</script>
<style>body{margin:0;background:#f7f5f0;color:#1a1814;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.center{max-width:440px;margin:14vh auto;text-align:center;padding:0 16px}@media (prefers-color-scheme:dark){body{background:#15130f;color:#ece6da}}</style>
</head>
<body>
<div id="app"><div class="center"><h2>一对一教务台</h2><p class="muted">加载中…</p></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
// 每次打开先读「当前版本号」（不走缓存），再按这个版本加载样式和脚本——网站更新后马上生效
(function(){
  var files = ['app.js','track.js','profile.js','extras.js','school_fields.js','schools.js'];
  function boot(v){
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'style.css?v=' + v; document.head.appendChild(css);
    (function next(i){ if (i >= files.length) { document.dispatchEvent(new Event('app-ready')); return; }
      var sc = document.createElement('script'); sc.src = files[i] + '?v=' + v; sc.onload = function(){ next(i + 1); };
      sc.onerror = function(){ document.getElementById('app').innerHTML = '<div class="center"><h2>暂时打不开</h2><p>网络不太稳定，请稍后刷新再试。</p></div>'; };
      document.body.appendChild(sc); })(0);
  }
  fetch('version.txt?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.ok ? r.text() : 'x'; })
    .then(function(v){ boot(v.trim() || 'x'); }).catch(function(){ boot(String(Date.now())); });
})();
</script>
</body>
</html>
